name: Deploy garageBlog

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to sandbox.elegarage.fr
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone app
        run: npm run build
        env:
          # Valeurs factices nécessaires pour le build.
          # En ligne, ce sont les variables de l'app Node dans cPanel qui seront utilisées.
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          BETTER_AUTH_SECRET: build-only-not-a-real-secret
          BETTER_AUTH_URL: https://sandbox.elegarage.fr

      - name: Prepare standalone bundle
        run: |
          # Next ne copie ni les fichiers statiques (CSS, JS) ni public/ dans standalone
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/public
          if [ -d public ]; then cp -R public/. .next/standalone/public; fi

          # Le bundle doit être complet, sinon on s'arrête ici
          test -f .next/standalone/server.js
          test -f .next/standalone/.next/BUILD_ID
          test -d .next/standalone/.next/static

          # Aucun fichier de variables ne doit partir sur le serveur
          if [ -n "$(find .next/standalone -maxdepth 3 -name '.env*')" ]; then
            echo "Un fichier .env se trouve dans standalone" >&2
            exit 1
          fi

          # L'archive à envoyer, rangée dans le dossier temporaire de la machine GitHub
          tar -czf "$RUNNER_TEMP/garageblog.tar.gz" -C .next/standalone .
          ls -lh "$RUNNER_TEMP/garageblog.tar.gz"

      - name: Detect runner public IP
        id: runner_ip
        run: |
          IP=$(curl -fsSL https://api.ipify.org)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $IP"

      - name: Reset SSH whitelist on o2switch
        run: |
          curl -fsSL \
            -H "Authorization: cpanel ${{ vars.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ vars.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all" \
            | grep -q '"status":1'

      - name: Add runner IP to SSH whitelist
        run: |
          curl -fsSL \
            -H "Authorization: cpanel ${{ vars.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ vars.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.runner_ip.outputs.ip }}&port=22" \
            | grep -q '"status":1'

      - name: Wait for firewall propagation
        run: sleep 10

      - name: Install SSH private key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.CPANEL_SERVER }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            ${{ vars.CPANEL_USER }}@${{ vars.CPANEL_SERVER }} "echo SSH OK"

      - name: Upload release archive
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/garageblog.tar.gz" \
            ${{ vars.CPANEL_USER }}@${{ vars.CPANEL_SERVER }}:${{ vars.DEPLOY_PATH }}.tar.gz

      - name: Install release on o2switch
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            ${{ vars.CPANEL_USER }}@${{ vars.CPANEL_SERVER }} '
              set -euo pipefail

              DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
              ARCHIVE="${DEPLOY_PATH}.tar.gz"

              # Garde-fou : jamais de suppression si le chemin est vide ou la racine
              if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
                echo "DEPLOY_PATH vide ou dangereux" >&2
                exit 1
              fi

              test -f "$ARCHIVE"
              test -d "$DEPLOY_PATH"

              # Supprime seulement l ancien site, comme à la main (le reste du dossier est gardé)
              cd "$DEPLOY_PATH"
              rm -rf .next node_modules public server.js package.json
              tar -xzf "$ARCHIVE" -C "$DEPLOY_PATH"
              rm -f "$ARCHIVE"

              # Le nouveau site doit être complet
              test -f server.js
              test -f .next/BUILD_ID
              test -d .next/static

              # Passenger redémarre l app au prochain passage s il voit ce fichier modifié
              mkdir -p tmp
              touch tmp/restart.txt
              ls -la
            '

      - name: Cleanup SSH whitelist
        if: always()
        run: |
          curl -fsSL \
            -H "Authorization: cpanel ${{ vars.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ vars.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all" || true
